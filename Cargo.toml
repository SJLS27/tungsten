[package]
name = "tungsten"
version = "0.1.0"
edition = "2021"
authors = ["Tungsten Contributors"]
description = "Un compositor Wayland ligero inspirado en XFCE"
license = "MIT"

[dependencies]
slog = "2.7"
slog-stdlog = "4.1"
slog-term = "2.9"
slog-async = "2.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }
dirs = "5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
